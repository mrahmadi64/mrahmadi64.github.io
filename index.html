<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="محمدرضا خواجونداحمدی — تحلیلگر داده و متخصص هوش تجاری | Python، SQL، Power BI، مدل‌سازی داده و داشبوردهای تصمیم‌یار">
<meta name="theme-color" content="#6E0F6C">
<title>محمدرضا خواجونداحمدی | تحلیلگر داده و متخصص هوش تجاری</title>

<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />

<style>
/* ============ 1) توکن‌های طراحی ============ */
:root{
  --brand:#6E0F6C;
  --brand-2:#A32BA0;
  --accent:#00B8A9;
  --bg:#ffffff;
  --bg-soft:#f7f5fa;
  --card:#ffffff;
  --text:#1b1823;
  --muted:#6b6577;
  --border:#eae5f1;
  --shadow-sm:0 2px 10px rgba(24,10,40,.06);
  --shadow:0 14px 40px rgba(24,10,40,.10);
  --radius:18px;
  --radius-sm:12px;
  --maxw:1080px;
}
html[data-theme="dark"]{
  --bg:#0e0a13;
  --bg-soft:#141020;
  --card:#191324;
  --text:#f3eff8;
  --muted:#a79fb5;
  --border:#2b2439;
  --shadow-sm:0 2px 10px rgba(0,0,0,.4);
  --shadow:0 14px 40px rgba(0,0,0,.55);
}

*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:'Vazirmatn',system-ui,-apple-system,sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.9;
  overflow-x:hidden;
  transition:background .3s ease,color .3s ease;
}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
.container{max-width:var(--maxw);margin:0 auto;padding:0 20px}
section{padding:70px 0;position:relative}

/* ============ 2) هدر ============ */
.site-header{
  position:sticky;top:0;z-index:900;
  backdrop-filter:blur(14px);
  background:color-mix(in srgb,var(--bg) 82%,transparent);
  border-bottom:1px solid var(--border);
}
.nav{display:flex;align-items:center;justify-content:space-between;gap:16px;height:64px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.2px}
.logo-mark{
  width:34px;height:34px;border-radius:10px;
  background:linear-gradient(135deg,var(--brand),var(--brand-2));
  display:grid;place-items:center;color:#fff;font-size:13px;font-weight:800;
  box-shadow:0 6px 18px rgba(110,15,108,.35);
}
.nav-links{display:flex;gap:6px;align-items:center}
.nav-links a{
  padding:8px 14px;border-radius:10px;font-size:14px;color:var(--muted);
  transition:.2s;font-weight:500;
}
.nav-links a:hover{color:var(--brand);background:var(--bg-soft)}
.theme-btn{
  width:38px;height:38px;border-radius:11px;border:1px solid var(--border);
  background:var(--card);color:var(--text);cursor:pointer;display:grid;place-items:center;
  transition:.2s;font-size:16px;
}
.theme-btn:hover{border-color:var(--brand);color:var(--brand)}
.burger{display:none}

/* ============ 3) هیرو ============ */
.hero{padding:64px 0 50px;overflow:hidden}
.hero::before{
  content:"";position:absolute;inset:0;z-index:-2;
  background-image:
    linear-gradient(to left,var(--border) 1px,transparent 1px),
    linear-gradient(to bottom,var(--border) 1px,transparent 1px);
  background-size:46px 46px;
  mask-image:radial-gradient(ellipse 75% 62% at 60% 30%,#000 20%,transparent 78%);
  -webkit-mask-image:radial-gradient(ellipse 75% 62% at 60% 30%,#000 20%,transparent 78%);
  opacity:.85;
}
.hero::after{
  content:"";position:absolute;z-index:-1;
  width:420px;height:420px;border-radius:50%;
  top:-140px;left:-120px;
  background:radial-gradient(circle,rgba(110,15,108,.28),transparent 65%);
  filter:blur(30px);
}
.
